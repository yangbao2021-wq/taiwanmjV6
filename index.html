<style>

.hr{display:flex;flex-wrap:wrap;gap:1px;justify-content:center}.hr .t.sm{--w:calc(var(--mw)*.5)}
.cm button{align-self:center;min-height:54px;font-size:24px;font-weight:900;padding:0 36px;border:4px solid #222;background:#ffd24a;color:#222;box-shadow:0 5px 0 #222;border-radius:16px}
@keyframes pop{0%{transform:scale(.2) rotate(-14deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}

@media(orientation:portrait){.cm{grid-template-columns:1fr;align-content:center}.bub2::before,.bub2::after{display:none}}
/* rotate hint */
#rot{display:none;position:fixed;inset:0;z-index:300;background:#10201a;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:24px;font-weight:900;text-align:center;padding:24px}

<script>

// ---- 角色（名稱為草稿；台詞為自擬占位，請以官網原文取代）----
const CH_OLD=`素還真|天下蒼生，盡在我心|一頁書|佛心不動，胡牌自來|葉小釵|劍在人在，這把我贏|藏鏡人|桀桀，這局由我主宰|史艷文|俠義之心，胡得坦蕩|緗羅|溫柔一笑，牌已入局|黑白郎|黑白分明，勝負自見|疏樓龍宿|吾胡牌，亦要華麗|劍子仙蹟|仙蹟一現，牌局已定|佛劍分說|一劍一佛，皆是胡牌|秦假仙|哎呀，被我矇到了|怪老子|嘿嘿，老子不出手則已|赤羽信之介|劍意所至，無所不胡|哭神|苦海無邊，這把我贏|業途靈|業途之下，誰能逃過|殺無生|眾生皆輸，唯我獨尊|蔭屍人|嘿嘿嘿，牌來了|半截菩提|半截菩提，滿盤皆贏|傲笑紅塵|笑傲紅塵，胡牌何難|夜叉|夜色之中，牌聲驚魂|劍布衣|一劍布衣，胡遍江湖|俏如來|如來一笑，牌局可解|默蒼離|謀定而後動，胡了|鬼棄|莫問鬼神，只問牌運|玄宗|道心澄明，自摸天成|邪天御武|邪天之下，我最強|魔王子|魔氣一出，眾牌俯首|銀燕|燕過無痕，牌已到手|百世經綸|經綸百世，這局穩了|拜月|月下一局，勝負已分|夢仙|如夢似幻，卻是真胡|六禍蒼龍|六禍臨頭，你們輸定了|戮世摩羅|戮盡世間，牌桌也不例外|龍戰野|龍戰於野，其血玄黃|公孫月|月光之下，胡得漂亮|武君|武道無敵，牌道亦然|神蠱溫皇|溫皇不輸，只是在贏|凜雪鴉|鴉影一閃，牌已不見|殤不患|不患不患，胡了再說|蠍瓔珞|別小看女人的牌技|狩雲霄|雲霄之上，一手遮天|嘯日猋|嘯日猋出，風捲殘牌|浪巫謠|浪跡天涯，牌也隨我|殺無赦|殺無赦，一個不留|天策真龍|真龍天子，天下牌運歸我|無夢生|無夢無欲，自在胡牌|蒼狼|狼行千里，必奪此牌|絕代天驕|天驕之姿，何須贅言|紫荊衣|衣袂翻飛，已然聽牌|冷劍白狐|冷劍出鞘，一擊必胡`.split('|').reduce((a,v,i,r)=>(i%2==0&&a.push({n:v,q:r[i+1],h:Math.round(i/2*47)%360}),a),[]);
const BG=[["琉璃仙境",190,260],["天都神殿",45,20],["雲渡山",150,200],["黑河谷",230,270],["萬聖巖",30,10],["魔界",340,280],["嘯天崖",200,230],["苦境竹林",120,160],["雙龍崗",20,350],["佛鄉",50,30],["異境荒原",35,0],["魔王殿",280,330],["暮雨江畔",210,180],["劍之初石室",220,240],["血染長空",0,340],["九幽冥界",260,300],["碧落雲海",195,215],["桃源谷",330,100],["雪原",200,220],["蓮池禪境",160,120]];

function mel(c,i){while(i<34&&!c[i])i++;if(i>=34)return 0;let r=-1;

function best(c){let r=-1;for(let i=0;i<34;i++)if(c[i]>=2){c[i]-=2;const x=mel(c,0);c[i]+=2;if(x>r)r=x}return r}

function calc(p,self,wt){const t=[],add=(n,x)=>x&&t.push([n,x]),c=p.c,all=c.slice();

if(!open&&self)add('不求人',3);else{if(!open)add('門清',1);if(self)add('自摸',1)}
if(!self&&sum==2&&p.m.length==5&&!p.m.some(m=>m.k=='a'))add('全求',2);
add('花牌',p.f.filter(f=>(f-34)%4==p.id).length);
[34,38].forEach(s=>{if([0,1,2,3].every(k=>p.f.includes(s+k)))add('花槓',2)});
const dr=[31,32,33].filter(i=>all[i]>=3);dr.forEach(i=>add(HZ[i-27],1));
if(dr.length==3)add('大三元',8);else if(dr.length==2&&[31,32,33].some(i=>all[i]==2))add('小三元',4);
const sw=(p.id-S.dealer+4)%4,q=(S.rot>>2)%4;
if(all[27+sw]>=3)add('門風',1);if(all[27+q]>=3)add('圈風',1);

const used=[0,1,2].filter(s=>all.slice(s*9,s*9+9).some(x=>x)),hon=all.slice(27,34).some(x=>x);
if(!used.length)add('字一色',16);else if(used.length==1)hon?add('混一色',4):add('清一色',8);
const b=best(c),cs=(sum-2)/3;
if(!p.m.some(m=>m.k=='c')&&b==cs)add('碰碰胡',4);

return t}

$('me').innerHTML=`<div>${avh(m.ch,34)} <b>${m.ch.n}</b>（你）${SEAT[(S.dealer*3)%4==0?0:(0-S.dealer+4)%4]}家${S.dealer==0?'(莊)':''} · 💰 ${m.money.toLocaleString()} ${m.f.length?' · 花×'+m.f.length:''}</div><div class="row">${m.m.map(x=>meldH(x)).join('')}</div><div class="row">${m.d.map(x=>th(x,'sm')).join('')}</div><div class="row" id="hand" style="margin-top:8px">${handH(m)}</div>`;
$('hand').className='row'+(S.pick?' pick':'');
$('hand').onclick=e=>{const t=e.target.closest('.t');if(t&&S.pick){const r=S.pick;S.pick=null;$('acts').innerHTML='';$('hand').className='row';r({t:'dis',i:+t.dataset.i})}}}
function ask(opts){const w=(opts[0]&&opts[0][0]||'')[0];if('碰吃槓胡'.includes(w)&&w){SFX.cue()}return new Promise(res=>{const a=$('acts');a.innerHTML='';opts.concat([['過',0]]).forEach(o=>{const b=document.createElement('button');b.textContent=o[0];if(!o[1])b.className='alt';b.onclick=()=>{a.innerHTML='';res(o[1])};a.appendChild(b)})})}
function modal(html,btn='繼續'){return new Promise(res=>{const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="mb">${html}<div style="text-align:center;margin-top:10px"><button>${btn}</button></div></div>`;d.querySelector('button').onclick=()=>{d.remove();res()};document.body.appendChild(d)})}
// ---- 遊戲流程 ----
function take(p,end){let t;do{t=end?S.wall.shift():S.wall.pop();if(t>=34)p.f.push(t)}while(t>=34);return t}
function aiDisc(p){let b=99,bi=0;for(let i=0;i<34;i++)if(p.c[i]){const nb=i<27?(i%9>0?p.c[i-1]:0)+(i%9<8?p.c[i+1]:0)+.5*((i%9>1?p.c[i-2]:0)+(i%9<7?p.c[i+2]:0)):0;let v=p.c[i]*10+nb*3+(i>=27&&p.c[i]==1?-3:0)+Math.random();if(v<b){b=v;bi=i}}return bi}
async function choose(p,dr){
if(p.id==0){const a=$('acts');a.innerHTML='';return new Promise(res=>{
if(dr!=null&&best(p.c)>=0){const b=document.createElement('button');b.textContent='自摸胡！';b.onclick=()=>{a.innerHTML='';S.pick=null;res({t:'hu'})};a.appendChild(b)}
for(let i=0;i<34;i++)if(p.c[i]==4){const b=document.createElement('button');b.className='alt';b.textContent='暗槓 '+tn(i);b.onclick=()=>{a.innerHTML='';S.pick=null;res({t:'an',i})};a.appendChild(b)}
S.dr=dr;S.pick=res;draw()})}
await sleep(500);const D=S.diff;
if(dr!=null&&best(p.c)>=0&&!(D==0&&Math.random()<.25))return{t:'hu'};
if(D>0)for(let i=0;i<34;i++)if(p.c[i]==4)return{t:'an',i};
return{t:'dis',i:D==0?aiEasy(p):D==1?aiDisc(p):aiHard(p)}}
async function hand(){S.wall=[];for(let i=0;i<34;i++)for(let k=0;k<4;k++)S.wall.push(i);for(let i=34;i<42;i++)S.wall.push(i);
for(let i=S.wall.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[S.wall[i],S.wall[j]]=[S.wall[j],S.wall[i]]}
S.last=null;S.p.forEach(p=>{p.c.fill(0);p.m=[];p.f=[];p.d=[]});
for(const p of S.p)for(let k=0;k<16;k++)p.c[take(p)]++;
SFX.shuffle();let cur=S.dealer,dr=take(S.p[cur]);
while(true){const p=S.p[cur];if(dr!=null)p.c[dr]++;draw(cur);let ds=null;
while(ds==null){const a=await choose(p,dr);
if(a.t=='hu')return{w:cur,self:true};
if(a.t=='an'){p.c[a.i]-=4;p.m.push({k:'a',t:a.i});if(S.wall.length<=16)return null;dr=take(p,1);p.c[dr]++;draw();continue}
ds=a.i}
p.c[ds]--;p.d.push(ds);S.last=ds;dr=null;draw();SFX.click();await sleep(300);
for(let k=1;k<4;k++){const o=(cur+k)%4,q=S.p[o];q.c[ds]++;const ok=best(q.c)>=0;q.c[ds]--;
if(ok){let go=1;if(o==0)go=await ask([['胡！',1]]);else if(S.diff==0&&Math.random()<.25)go=0;if(go){q.c[ds]++;p.d.pop();return{w:o,self:false,from:cur,t:ds}}}}
let nx=null;
for(let k=1;k<4&&nx==null;k++){const o=(cur+k)%4,q=S.p[o];if(q.c[ds]>=2){let r;
if(o==0){const op=[['碰 '+tn(ds),1]];if(q.c[ds]==3)op.push(['槓 '+tn(ds),2]);r=await ask(op)}
else r=aiClaim(q,ds);
if(r==1){q.c[ds]-=2;q.m.push({k:'p',t:ds});say(o,'碰！');p.d.pop();nx=o}
else if(r==2){q.c[ds]-=3;q.m.push({k:'k',t:ds});say(o,'槓！');p.d.pop();nx=o;if(S.wall.length<=16)return null;dr=take(q,1)}}}
if(nx==null&&ds<27){const o=(cur+1)%4,q=S.p[o],s0=ds-ds%9,op=[];
for(let s=ds-2;s<=ds;s++)if(s>=s0&&s+2<=s0+8){const need=[s,s+1,s+2].filter(x=>x!=ds);if(need.every(x=>q.c[x]>0))op.push(s)}
if(op.length){let s=0;if(o==0)s=await ask(op.map(x=>['吃 '+tn(x)+tn(x+1)+tn(x+2),x+1]))-1;else s=aiChi(q,ds,op);
if(s>=0){[s,s+1,s+2].filter(x=>x!=ds).forEach(x=>q.c[x]--);q.m.push({k:'c',t:s});say(o,'吃！');p.d.pop();nx=o}}}
if(nx==null){cur=(cur+1)%4;if(S.wall.length<=16)return null;dr=take(S.p[cur])}else cur=nx}}
async function win(r){const w=S.p[r.w],tai=calc(w,r.self,r.t),T=tai.reduce((a,b)=>a+b[1],0),amt=S.base+T*S.per;let log='';
const pay=(f,t)=>{const x=Math.min(amt,Math.max(f.money,0)+0);f.money-=amt;t.money+=amt;log+=`<div>${f.ch.n} → ${t.ch.n}：${amt.toLocaleString()}</div>`};
if(r.self)S.p.forEach(p=>p!=w&&pay(p,w));else pay(S.p[r.from],w);
draw(r.w);SFX.win();speak(r.self?'自摸':'胡了',w.ch,.9);speak(w.ch.q,w.ch,.95,1);
await modal(`<div style="text-align:center">${avh(w.ch,56)}<h2 style="margin:6px 0">${w.ch.n} ${r.self?'自摸':'胡牌'}！</h2><div class="say">「${w.ch.q}」</div></div><div class="row" style="justify-content:center">${w.m.map(m=>meldH(m)).join('')}${handH(w).replace(/class="t/g,'class="t sm')}</div><p><b>${T} 台</b>：${tai.map(x=>x[0]+x[1]+'台').join('、')||'無'}</p><p class="small">每家付 底${S.base}＋${T}×${S.per}＝${amt.toLocaleString()}</p>${log}`);
return r}
async function run(){S.dealer=0;S.rot=0;S.lian=0;
while(S.rot<16){const r=await hand();let stay;
if(!r){await modal('<h2>流局</h2><p>牌牆用盡，莊家連莊。</p>');stay=1}else{await win(r);stay=r.w==S.dealer}
if(stay)S.lian++;else{S.dealer=(S.dealer+1)%4;S.rot++;S.lian=0}
if(S.p.some(p=>p.money<=0))break}
draw();const R=[...S.p].sort((a,b)=>b.money-a.money),bk=S.p.find(p=>p.money<=0);
await modal(`<h2>結算</h2><p class="small">${bk?bk.ch.n+' 破產，遊戲結束':'已打完 4 圈'}</p>${R.map((p,i)=>`<div style="margin:6px 0">${i+1}. ${avh(p.ch,28)} ${p.ch.n}${p===S.p[0]?'（你）':''}：${p.money.toLocaleString()}（${p.money-cfg.init>=0?'+':''}${(p.money-cfg.init).toLocaleString()}）</div>`).join('')}`,'再玩一次');location.reload()}
$('go').onclick=()=>{ac();if(MUSON)musStart();if(window.speechSynthesis){try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}}if(sel==null){$('selname').textContent='⚠ 請先點選上方一位角色';$('selname').style.color='#ffd24a';return}
cfg={init:+$('init').value||100000};
const pool=CH.map((_,i)=>i).filter(i=>i!=sel).sort(()=>Math.random()-.5).slice(0,3);
S={diff:+$('diff').value,base:+$('base').value||0,per:+$('per').value||0,wall:[],cur:0,last:null,
p:[sel,...pool].map((ci,id)=>({id,ch:CH[ci],money:cfg.init,c:Array(34).fill(0),m:[],f:[],d:[]}))};

$('setup').style.display='none';$('game').style.display='block';run()};
</script>
<script>
const PP={1:[[15,20]],2:[[15,11],[15,29]],3:[[8,9],[15,20],[22,31]],4:[[9,12],[21,12],[9,28],[21,28]],5:[[9,12],[21,12],[15,20],[9,28],[21,28]],6:[[9,9],[21,9],[9,20],[21,20],[9,31],[21,31]],7:[[8,6],[15,11],[22,16],[9,27],[21,27],[9,35],[21,35]],8:[[9,7],[21,7],[9,16],[21,16],[9,25],[21,25],[9,34],[21,34]],9:[[7,9],[15,9],[23,9],[7,20],[15,20],[23,20],[7,31],[15,31],[23,31]]};
const SR={2:[1,1],3:[1,2],4:[2,2],5:[2,1,2],6:[3,3],7:[1,3,3],8:[3,2,3],9:[3,3,3]};
function pinSv(n){const r=n==1?9:n<5?6:4.6,cl=['#1a4f9c','#1d7a3a','#c0281f'];return `<svg viewBox="0 0 30 40">${PP[n].map((p,k)=>{const c=n==1?'#c0281f':cl[k%3];return `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="#fff" stroke="${c}" stroke-width="1.8"/><circle cx="${p[0]}" cy="${p[1]}" r="${r*.45}" fill="${c}"/>`}).join('')}</svg>`}
function souSv(n){if(n==1)return '<svg viewBox="0 0 30 40"><text x="15" y="30" font-size="26" text-anchor="middle">🦜</text></svg>';if(n==8)return '<svg viewBox="0 0 30 40"><g stroke="#1d7a3a" stroke-width="3.8" stroke-linecap="round"><path d="M5 2.5V17.5M25 2.5V17.5M5 22.5V37.5M25 22.5V37.5M10.5 2.5L14.5 17.5M19.5 2.5L15.5 17.5M14.5 22.5L10.5 37.5M15.5 22.5L19.5 37.5"/></g><g stroke="#f6f1df" stroke-width=".9"><path d="M3.5 10H6.5M23.5 10H26.5M3.5 30H6.5M23.5 30H26.5M11 10H14M16 10H19M11 30H14M16 30H19"/></g></svg>';const R=SR[n],h=(40-(R.length-1)*2.2)/R.length;let y=0,o='';R.forEach((c,ri)=>{const w=30/c;for(let k=0;k<c;k++){const x=w*k+w/2,col=(ri==1&&n>4)||(n==2&&ri==0)?'#c0281f':'#1d7a3a';o+=`<rect x="${x-2}" y="${y}" width="4" height="${h}" rx="2" fill="${col}"/><rect x="${x-2}" y="${y+h/2-.6}" width="4" height="1.2" fill="#f6f1df"/>`}y+=h+2.2});return `<svg viewBox="0 0 30 40">${o}</svg>`}
function th(i,cls=''){if(i>=34)return `<div class="t f ${cls}">花</div>`;if(i>=27)return `<div class="t h${i} ${cls}" data-i="${i}">${i==33?'<span class="wh"></span>':HZ[i-27]}</div>`;const s=i/9|0,n=i%9+1;return `<div class="t s${s} ${cls}" data-i="${i}">${s==0?`<b>${NU[n-1]}</b><i>萬</i>`:s==1?pinSv(n):souSv(n)}</div>`}
const bkH=n=>`<div class="row" style="gap:1px">${'<div class="t sm bk"></div>'.repeat(n)}</div>`;
function seat(i){const p=S.p[i],n=p.c.reduce((a,b)=>a+b,0);return `${bust(i,i==2?'':'sd')}<div class="pn ${S.cur==i?'turn':''}"><div><b>${p.ch.n}</b><br><span class="small">${SEAT[(i-S.dealer+4)%4]}${i==S.dealer?'莊':''} 💰${p.money.toLocaleString()}</span></div></div><div class="row">${p.m.map(m=>meldH(m)).join('')}${p.f.length?'花×'+p.f.length:''}</div>${bkH(n)}`}
function draw(cur){if(cur!=null)S.cur=cur;const P=S.p,m=P[0];
$('top').innerHTML=`${W()} · 莊：${P[S.dealer].ch.n}${S.lian?' 連'+S.lian:''} · 牌牆 ${S.wall.length} · 底 ${S.base} 每台 ${S.per} · 難度 ${["簡單","中等","困難"][S.diff]}`;
[1,2,3].forEach(i=>$('s'+i).innerHTML=seat(i));
[0,1,2,3].forEach(i=>$('rv'+i).innerHTML=P[i].d.map(x=>th(x,'sm')).join('')+'<div class="t sm" style="visibility:hidden"></div>'.repeat(Math.max(0,18-P[i].d.length)));
$('mid').innerHTML=`<div style="font-size:clamp(28px,7vw,48px);font-weight:900;color:#ffd24a;text-shadow:0 2px 4px #000">${W()}</div>${S.lian?`<div class="small">連莊 ${S.lian}</div>`:''}`+(S.last!=null?`<div class="small">最新打出 <b>${tn(S.last)}</b></div>`:'');
$('me').className='me '+(S.cur==0?'turn':'');
$('me').innerHTML=`${bust(0)}<div class="pn ${S.cur==0?'turn':''}"><div><b>${m.ch.n}</b>（你）<br><span class="small">${SEAT[(4-S.dealer)%4]}${S.dealer==0?'莊':''} 💰${m.money.toLocaleString()}${m.f.length?' 花×'+m.f.length:''}</span></div></div><div class="row">${m.m.map(x=>meldH(x)).join('')}</div><div class="row" id="hand" style="margin-top:6px">${handH(m)}</div>`;
$('hand').className='row'+(S.pick?' pick':'');
$('hand').onclick=e=>{const t=e.target.closest('.t');if(!t||!t.dataset.i||!S.pick)return;const i=+t.dataset.i;if(S.sel===i){const r=S.pick;S.pick=null;S.sel=null;$('acts').innerHTML='';$('hand').className='row';r({t:'dis',i})}else{S.sel=i;mark()}};mark();chk()}
function mark(){document.querySelectorAll('#hand .t.up').forEach(x=>x.classList.remove('up'));if(S.sel!=null&&S.pick){const e=[...document.querySelectorAll('#hand .t')].find(x=>+x.dataset.i===S.sel);e&&e.classList.add('up')}}


function bust(i,cls=''){const p=S.p[i],c=p.ch;return `<div class="bust ${cls} ${S.cur==i?'turn':''}"><div class="body" style="background:linear-gradient(hsl(${c.h},45%,36%),hsl(${c.h},45%,20%))"></div><img src="${IMGS[c.n]}" alt="${c.n}">${S.say&&S.say[i]?`<div class="bub">${S.say[i]}</div>`:''}</div>`}
function say(i,t){SFX.claim();speak(t.replace('！',''),S.p[i].ch,1.05);S.say=S.say||{};S.say[i]=t;draw();setTimeout(()=>{S.say[i]=null;draw()},1300)}
const W=()=>SEAT[(S.rot>>2)%4]+'風'+NU[S.rot%4];
function shant(c,m0){let best=99;
function ta(i,m,t,p){while(i<34&&!c[i])i++;if(i>=34){best=Math.min(best,10-2*m-Math.min(t,5-m)-p);return}
if(c[i]>=2){c[i]-=2;if(!p)ta(i,m,t,1);if(m+t<5)ta(i,m,t+1,p);c[i]+=2}
if(m+t<5){if(i<27&&i%9<8&&c[i+1]){c[i]--;c[i+1]--;ta(i,m,t+1,p);c[i]++;c[i+1]++}
if(i<27&&i%9<7&&c[i+2]){c[i]--;c[i+2]--;ta(i,m,t+1,p);c[i]++;c[i+2]++}}
const x=c[i];c[i]=0;ta(i+1,m,t,p);c[i]=x}
function me(i,m){while(i<34&&!c[i])i++;if(i>=34){ta(0,m,0,0);return}
if(c[i]>=3){c[i]-=3;me(i,m+1);c[i]+=3}
if(i<27&&i%9<7&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;me(i,m+1);c[i]++;c[i+1]++;c[i+2]++}
me(i+1,m)}
me(0,m0);return best}
function tv(p,i){const c=p.c,nb=i<27?(i%9>0?c[i-1]:0)+(i%9<8?c[i+1]:0)+.5*((i%9>1?c[i-2]:0)+(i%9<7?c[i+2]:0)):0;return c[i]*10+nb*3+(i>=27&&c[i]==1?-3:0)}
function aiEasy(p){if(Math.random()<.5){const l=[];for(let i=0;i<34;i++)for(let k=0;k<p.c[i];k++)l.push(i);return l[Math.random()*l.length|0]}return aiDisc(p)}
function aiHard(p){const v=Array(34).fill(0);S.p.forEach(q=>{q.d.forEach(x=>v[x]++);q.m.forEach(m=>{if(m.k=='c'){v[m.t]++;v[m.t+1]++;v[m.t+2]++}else v[m.t]+=m.k=='p'?3:4})});for(let i=0;i<34;i++)v[i]+=p.c[i];
const m=p.m.length;let bs=99,cand=[];
for(let i=0;i<34;i++)if(p.c[i]){p.c[i]--;const s=shant(p.c,m);p.c[i]++;if(s<bs){bs=s;cand=[i]}else if(s==bs)cand.push(i)}
cand.sort((a,b)=>tv(p,a)-tv(p,b));cand=cand.slice(0,6);
const danger=S.p.some(q=>q!==p&&q.m.length>=3);let bi=cand[0],bv=-1e9;
for(const i of cand){p.c[i]--;let u=0;for(let t=0;t<34;t++){if(v[t]>=4)continue;p.c[t]++;if(shant(p.c,m)<bs)u+=4-v[t];p.c[t]--}p.c[i]++;
if(danger&&!S.p.some(q=>q!==p&&q.d.includes(i)))u-=6;if(i>=27||i%9==0||i%9==8)u+=.5;if(u>bv){bv=u;bi=i}}
return bi}
function aiClaim(q,ds){const D=S.diff,n=q.c[ds];
if(D==0)return n==3?0:(Math.random()<(ds>=27?.3:.15)?1:0);
if(D==1)return n==3?2:(ds>=27||Math.random()<.45?1:0);
if(n==3&&ds>=27)return 2;const m=q.m.length;q.c[ds]++;const base=shant(q.c,m);q.c[ds]--;q.c[ds]-=2;const aft=shant(q.c,m+1);q.c[ds]+=2;
return aft<base||(aft==base&&(ds>=31||ds==27+(q.id-S.dealer+4)%4||ds==27+((S.rot>>2)%4)))?1:0}
function aiChi(q,ds,op){const D=S.diff;if(D==0)return Math.random()<.1?op[0]:-1;if(D==1)return Math.random()<.3?op[0]:-1;
const m=q.m.length;q.c[ds]++;const base=shant(q.c,m);q.c[ds]--;let bs=-1,bv=base;
for(const s of op){const rm=[s,s+1,s+2].filter(x=>x!=ds);rm.forEach(x=>q.c[x]--);const v=shant(q.c,m+1);rm.forEach(x=>q.c[x]++);if(v<bv){bv=v;bs=s}}return bs}

const vh=()=>innerHeight;let K=1;
function bad(){return['app','gi','board'].some(id=>{const e=$(id);return e&&(e.scrollHeight>e.clientHeight+1||e.scrollWidth>e.clientWidth+1)})}
function shrink(){for(let i=0;i<18&&bad();i++){K*=.94;document.documentElement.style.setProperty('--k',K)}}
function fit(){K=1;document.documentElement.style.setProperty('--k',1);if($('game').style.display==='block')shrink()}
function chk(){if($('game').style.display==='block')shrink()}
let rz;const onrz=()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(fit)};

let AC=null,MUTE=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC}
function noise(t,d,f,g){const a=ac();if(!a||MUTE)return;const n=a.createBufferSource(),b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/x.length,3);n.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=1.2;const gn=a.createGain();gn.gain.value=g;n.connect(fl);fl.connect(gn);gn.connect(a.destination);n.start(a.currentTime+t)}
function tone(t,fr,d,g,ty){const a=ac();if(!a||MUTE)return;const o=a.createOscillator(),gn=a.createGain(),st=a.currentTime+t;o.type=ty||'triangle';o.frequency.value=fr;gn.gain.setValueAtTime(g,st);gn.gain.exponentialRampToValueAtTime(.001,st+d);o.connect(gn);gn.connect(a.destination);o.start(st);o.stop(st+d+.02)}
const SFX={click(){noise(0,.06,2200,.9);noise(0,.05,700,.6)},
shuffle(){for(let i=0;i<28;i++)noise(i*.045+Math.random()*.02,.07,1200+Math.random()*1500,.45)},
cue(){tone(0,880,.12,.22);tone(.12,1175,.2,.22)},

let MUS=null,MUSON=true;

function mtone(t,n,d,g,ty){const a=AC,o=a.createOscillator(),o2=a.createOscillator(),gn=a.createGain();o.type=ty||'triangle';o2.type='sine';o.frequency.value=mf(n);o2.frequency.value=mf(n)*2;const g2=a.createGain();g2.gain.value=.25;gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(g,t+.012);gn.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(gn);o2.connect(g2);g2.connect(gn);gn.connect(MUS.g);o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05)}
function mnoise(t,d,g){const a=AC,b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/x.length,2);const n=a.createBufferSource(),f=a.createBiquadFilter(),gn=a.createGain();n.buffer=b;f.type='highpass';f.frequency.value=5500;gn.gain.value=g;n.connect(f);f.connect(gn);gn.connect(MUS.g);n.start(t)}

function musStep(t){const S0=MUS.step,bar=(S0>>3)%8,e=S0&7,ch=CH_P[bar];
if(e==0){ch[1].forEach((n,i)=>mtone(t+i*.035,n,2.4,.05));mtone(t,ch[0]-12,1.3,.2,'sine')}
if(e==4)mtone(t,ch[0]-12+(bar%2?7:0),.9,.14,'sine');
if(e==3||(e==7&&Math.random()<.5))ch[1].slice(1).forEach((n,i)=>mtone(t+i*.02,n+12,.5,.022));

function musTick(){if(!MUS||!AC)return;const beat=60/74;while(MUS.next<AC.currentTime+.7){musStep(MUS.next);MUS.next+=(MUS.step&1)?beat*.36:beat*.64;MUS.step++}}
function musStart(){const a=ac();if(!a||MUS)return;const g=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;g.gain.value=0;g.gain.setTargetAtTime(.55,a.currentTime,.8);g.connect(lp);lp.connect(a.destination);MUS={g,lp,next:a.currentTime+.15,step:0,k:2};MUS.timer=setInterval(musTick,150);musTick()}
function musStop(){if(!MUS)return;const m=MUS;MUS=null;clearInterval(m.timer);try{m.g.gain.setTargetAtTime(0,AC.currentTime,.25)}catch(e){}setTimeout(()=>{try{m.g.disconnect();m.lp.disconnect()}catch(e){}},1500)}
$('mus').onclick=()=>{MUSON=!MUSON;$('mus').classList.toggle('off',!MUSON);$('mus').textContent=MUSON?'🎵':'🎵✕';ac();MUSON?musStart():musStop()};
